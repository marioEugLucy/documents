site_name: GVdasa Frontend PCL — Documentação
site_description: Template single-spa, instruções de desenvolvimento e Architecture Decision Records

plugins:
  - techdocs-core

markdown_extensions:
  - pymdownx.snippets:
      base_path: ['.']

nav:
  - Início: index.md
  - Desenvolvimento:
      - Visão geral (Copilot): instrucoes/copilot-instructions.md
      - Arquitetura: instrucoes/architecture.md
      - Componentes React: instrucoes/frontend.md
      - Template de ADR: instrucoes/adr-template.md
  - ADRs:
      - '0001 — single-spa': adr/0001-single-spa-como-framework-de-micro-frontend.md
      - '0002 — React 18 + TypeScript': adr/0002-react-18-typescript-como-stack.md
      - '0003 — Webpack / Vite': adr/0003-webpack-producao-vite-testes.md
      - '0004 — Material-UI + Design System': adr/0004-material-ui-design-system-gvdasa.md
      - '0005 — GVHttpClient': adr/0005-gvhttpclient-singleton-http.md
      - '0006 — Custom Events': adr/0006-custom-events-comunicacao-shell.md
      - '0007 — SWR / cache': adr/0007-swr-cache-dados-servidor.md
      - '0008 — Cache busting CDN': adr/0008-cache-busting-query-string-cdn.md
      - '0009 — GVObservable / App Insights': adr/0009-gvobservable-application-insights-telemetria.md
